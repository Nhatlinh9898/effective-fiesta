[project]
name = "multi-ai-fullstack-code-generator"
version = "0.1.0"
description = "Multi-Agent AI System for Full-Stack Code Generation with support for multiple AI models and programming languages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.76.0",
    "google-generativeai>=0.8.6",
    "httpx>=0.27.0",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "openai>=2.15.0",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "streamlit>=1.52.1",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agents", "ai_providers", "core", "templates", "utils"]